# ============================================================
# MOMO NOCTALIA
# Hyprland minimal gray top bar
# ============================================================


# ============================================================
# THEME
# ============================================================

[theme]

mode = "dark"
shell_mode = "dark"

source = "custom"
custom_palette = "MomoGray"

pure_black_dark = false


# ============================================================
# TOP BAR
# ============================================================

[bar.default]

enabled = true
position = "top"

# Always visible
auto_hide = false
smart_auto_hide = false
show_on_workspace_switch = true

# Keep tiled windows below the panel
reserve_space = true
layer = "top"

# Slightly larger than before
thickness = 42

# Dark / slightly transparent
background_opacity = 0.88

# Subtle outline
border = "outline"
border_width = 1.0

shadow = true
contact_shadow = false

# Rounded floating look
radius = 16

radius_top_left = 16
radius_top_right = 16
radius_bottom_left = 16
radius_bottom_right = 16

concave_edge_corners = false

# Distance from screen edges
margin_ends = 10
margin_edge = 8

# Internal spacing
padding = 10
widget_spacing = 8

hover_highlight = true

scale = 1.0
font_scale = 1.0
font_weight = 500

# No giant bubble around every widget
capsule = false


# ============================================================
# BAR LAYOUT
# ============================================================

# Left: workspaces only.
# Launcher is handled by Rofi (Super + Space).

start = [
    "workspaces"
]

# Center: clock

center = [
    "clock"
]

# Right: system information only.
# Control Center is available on Super + S.

end = [
    "tray",
    "network",
    "bluetooth",
    "volume",
    "keyboard_layout",
    "notifications",
    "session"
]


# ============================================================
# WORKSPACES
# ============================================================

[widget.workspaces]

style = "regular"

# Show 1 2 3 4 5
show_labels = true
show_icons = false

label_source = "id"
max_label_chars = 2

# Slightly larger workspace numbers
font_scale = 1.15
font_weight = 600

# Keep persistent empty workspaces visible
labels_only_when_occupied = false
hide_when_empty = false

show_all_outputs = false

# Balanced pill size
pill_scale = 0.88

active_pill_size = 2.10
inactive_pill_size = 1.0

# Colors follow MomoGray palette
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_variant"
urgent_color = "error"

change_color_on_hover = true
focused_output_only = false

capsule = false
capsule_radius = 14


# ============================================================
# CLOCK
# ============================================================

[widget.clock]

format = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

capsule = true

capsule_fill = "surface_variant"
capsule_foreground = "on_surface"

capsule_opacity = 0.62
capsule_padding = 11
capsule_radius = 11

font_scale = 1.02
font_weight = 600


# ============================================================
# SYSTEM TRAY
# ============================================================

[widget.tray]

capsule = false
scale = 0.95


# ============================================================
# NETWORK
# ============================================================

[widget.network]

capsule = false
scale = 0.95


# ============================================================
# BLUETOOTH
# ============================================================

[widget.bluetooth]

capsule = false
scale = 0.95


# ============================================================
# VOLUME
# ============================================================

[widget.volume]

capsule = false
scale = 0.95


# ============================================================
# KEYBOARD LAYOUT
# ============================================================

[widget.keyboard_layout]

capsule = true

capsule_fill = "surface_variant"
capsule_foreground = "on_surface_variant"

capsule_opacity = 0.52
capsule_padding = 7
capsule_radius = 9

font_scale = 0.92
font_weight = 600


# ============================================================
# NOTIFICATIONS
# ============================================================

[widget.notifications]

capsule = false
scale = 0.95


# ============================================================
# SESSION / POWER
# ============================================================

[widget.session]

capsule = true

capsule_fill = "surface_variant"
capsule_foreground = "on_surface_variant"

capsule_opacity = 0.55
capsule_padding = 8
capsule_radius = 10

