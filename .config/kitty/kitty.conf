# MOMO clean Kitty — shared safely by KDE and Hyprland
font_family JetBrainsMono Nerd Font
font_size 12.0
window_padding_width 14
window_margin_width 0
confirm_os_window_close 0
hide_window_decorations yes
background #090c10
foreground #e7e5df
background_opacity 0.93
dynamic_background_opacity yes
# Compositor handles blur, reducing reliance on OS-specific Kitty support.
background_blur 0
bold_font auto
italic_font auto
bold_italic_font auto
cursor #e9e7df
cursor_text_color #090c10
cursor_shape beam
cursor_blink_interval 0.6
selection_background #42474c
selection_foreground #f4f2ec
url_color #b9c3cc
url_style single
window_border_width 1
active_border_color #8c969f
inactive_border_color #30363b
tab_bar_style hidden
enable_audio_bell no
scrollback_lines 10000
# Inherit user's configured login shell; no hard-coded /usr/bin/fish.
